name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy src/transformer

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate notebook JSON (and that it matches the generator)
        run: |
          python build_notebook.py
          git diff --exit-code -- notebooks/

      - name: Equivalence tests (pytest) with coverage
        run: python -m pytest tests -q --cov=transformer --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Verification suite — learned positions
        run: python scripts/verify.py --n-chars 20

      - name: Verification suite — RoPE + GQA checkpoint
        run: python scripts/verify.py --rope --ckpt checkpoints/gpt_rope_gqa.pt --n-chars 20