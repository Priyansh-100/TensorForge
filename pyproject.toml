[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-from-scratch"
version = "1.1.0"
description = "A verified, from-scratch Transformer and mini-GPT — attention math, DDP, RoPE, GQA/MQA, BPE, AMP, KV caching, validated by an executable proof suite."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Priyansh" }]
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "nbformat>=5.9",
    "ipykernel>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
logging = [
    "tensorboard>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["notebooks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
# torch's dynamic nn.Module typing (register_buffer / ModuleList lookups)
# is inherently un-annotatable; keep the checks that find REAL bugs.
disable_error_code = ["union-attr", "operator", "index"]